[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.1"
description = "Polymarket data pipeline, paper trader and calibration tracker"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jay Zhang" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Repository = "https://github.com/JayZhangDev/PolyBot"

[tool.setuptools]
packages = ["polybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Dashboard HTML/CSS strings read better unwrapped.
"polybot/app.py" = ["E501"]
