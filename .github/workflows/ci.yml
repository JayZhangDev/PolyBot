name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  # The always-on image (docs/always-on.md): build it, then check it starts and knows its timetable.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t polybot .
      - run: docker run --rm polybot polybot run --plan
      - run: docker run --rm polybot python -c "import polybot.streamer, polybot.paper, polybot.rollup, polybot.agent"
